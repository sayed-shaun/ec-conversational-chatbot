services:

  ec-faq-mcp:
    build:
      context: .
      dockerfile: mcp.Dockerfile
    container_name: ec-faq-mcp
    environment:
      TOPK_API: ${TOPK_API:?set TOPK_API in .env}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.55}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-X", "POST", "http://localhost:9000/mcp", "-H", "Content-Type: application/json", "-H", "Accept: application/json, text/event-stream", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1\"}}}" ]
      interval: 15s
      timeout: 5s
      retries: 5

  ec-faq-chatbot:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: ec-faq-chatbot
    environment:
      LLAMA_BASE_API: ${LLAMA_BASE_API:?set LLAMA_BASE_API in .env}
      SPEECH_API: ${SPEECH_API:-}
      ASR_TIMEOUT: ${ASR_TIMEOUT:-60.0}
      TRACE_DIR: ${TRACE_DIR:-}
      TRACE_TTL_DAYS: ${TRACE_TTL_DAYS:-0}
      TRACE_SWEEP_HOURS: ${TRACE_SWEEP_HOURS:-6}
      TZ: ${TZ:-Asia/Dhaka}
      LLAMA_TEMPERATURE: ${LLAMA_TEMPERATURE:-0.2}
      ANSWER_CHECK: ${ANSWER_CHECK:-true}
      LLAMA_THINKING: ${LLAMA_THINKING:-false}
      MCP_SERVER_API: http://ec-faq-mcp:9000/mcp
      MAX_HISTORY_TURNS: ${MAX_HISTORY_TURNS:-20}
      SESSION_DB_PATH: ${SESSION_DB_PATH:-/data/sessions.db}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-10}
      SESSION_SWEEP_MINUTES: ${SESSION_SWEEP_MINUTES:-10}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./static:/app/static:ro
      - chat-sessions:/data
      - ./.tracing:/data/tracing
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ec-faq-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: ec-faq-caddy
    environment:
      LAN_HOST: ${LAN_HOST:?set LAN_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "${PORT:-9100}:443"
    depends_on:
      ec-faq-chatbot:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chat-sessions:
  caddy-data:
