services:

  ec-faq-mcp:
    build:
      context: .
      dockerfile: mcp.Dockerfile
    container_name: ec-faq-mcp
    environment:
      TOP_SIMILAR_API_URL: ${TOP_SIMILAR_API_URL:-http://172.31.60.228:8002/ec_bot/top_similar/}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.55}
      TAG_ANSWER_URL: ${TAG_ANSWER_URL:-https://raw.githubusercontent.com/Synesis-IT-PLC/ec-faq-bot/development/full_dataset/tag_answer.json}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TAG_ANSWER_ALLOW_LOCAL_FALLBACK: ${TAG_ANSWER_ALLOW_LOCAL_FALLBACK:-true}
      TAG_ANSWER_REFRESH_SECONDS: ${TAG_ANSWER_REFRESH_SECONDS:-0}
      TAG_ANSWER_PATH: /data/tag_answer.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      MCP_PATH: /mcp
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-X", "POST", "http://localhost:9000/mcp", "-H", "Content-Type: application/json", "-H", "Accept: application/json, text/event-stream", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1\"}}}" ]
      interval: 15s
      timeout: 5s
      retries: 5

  ec-faq-chatbot:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: ec-faq-chatbot
    environment:
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://host.docker.internal:8080/v1}
      LLAMA_MODEL: ${LLAMA_MODEL:-local-model}
      LLAMA_REASONING_EFFORT: ${LLAMA_REASONING_EFFORT:-}
      MCP_SERVER_URL: http://ec-faq-mcp:9000/mcp
      ASR_URL: ${ASR_URL:-http://172.31.60.228:8000}
      ASR_TIMEOUT: ${ASR_TIMEOUT:-60.0}
      TTS_URL: ${TTS_URL:-http://172.31.60.228:9300}
      MAX_HISTORY_TURNS: ${MAX_HISTORY_TURNS:-12}
      SESSION_DB_PATH: ${SESSION_DB_PATH:-/data/sessions.db}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      SESSION_SWEEP_MINUTES: ${SESSION_SWEEP_MINUTES:-10}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./static:/app/static:ro
      - chat-sessions:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ec-faq-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: ec-faq-caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PORT:-9100}:80"
    depends_on:
      ec-faq-chatbot:
        condition: service_healthy
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ec-faq-ngrok
    profiles: [ "public" ]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http caddy:80
    ports:
      - "4040:4040"
    depends_on:
      - caddy
    restart: on-failure:3

volumes:
  chat-sessions:
