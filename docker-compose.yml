services:

  pgvector-db:
    image: pgvector/pgvector:pg16
    container_name: ec-conversational-pgvector-db
    environment:
      POSTGRES_USER: ${VECTOR_DB_USER:-ec_faq}
      POSTGRES_PASSWORD: ${VECTOR_DB_PASSWORD:-ec_faq}
      POSTGRES_DB: ${VECTOR_DB_NAME:-ec_faq}
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${VECTOR_DB_USER:-ec_faq} -d ${VECTOR_DB_NAME:-ec_faq}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ec-conversational-vector:
    build:
      context: .
      dockerfile: vector.Dockerfile
    container_name: ec-conversational-vector
    environment:
      DATABASE_URL: ${VECTOR_DATABASE_URL:-postgresql://ec_faq:ec_faq@pgvector-db:5432/ec_faq}
      EMBEDDING_MODEL_NAME: ${VECTOR_EMBEDDING_MODEL_NAME:-intfloat/multilingual-e5-large-instruct}
      EMBEDDING_DIM: ${VECTOR_EMBEDDING_DIM:-1024}
      EMBEDDING_CACHE_DIR: /root/.cache/fastembed_cache
      TAG_ANSWER_URL: ${TAG_ANSWER_URL:-https://raw.githubusercontent.com/Synesis-IT-PLC/ec-faq-bot/development/full_dataset/tag_answer.json}
      QUESTION_TAG_CSV_URL: ${QUESTION_TAG_CSV_URL:-https://raw.githubusercontent.com/Synesis-IT-PLC/ec-faq-bot/feat/multilingual-en-banglish-questions/full_dataset/question_tag.csv}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      REINDEX_ENABLED: ${VECTOR_REINDEX_ENABLED:-true}
      REINDEX_HOUR_UTC: ${VECTOR_REINDEX_HOUR_UTC:-3}
      VECTOR_API_HOST: 0.0.0.0
      VECTOR_API_PORT: 8001
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - vector-model-cache:/root/.cache/fastembed_cache
    ports:
      # Localhost-only, for the Swagger UI at /docs -- /index and /reindex
      # have no auth, so this doesn't publish to 0.0.0.0.
      - "127.0.0.1:8001:8001"
    depends_on:
      pgvector-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8001/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  ec-conversational-mcp:
    build:
      context: .
      dockerfile: mcp.Dockerfile
    container_name: ec-conversational-mcp
    environment:
      TOP_SIMILAR_API_URL: ${TOP_SIMILAR_API_URL:-http://ec-conversational-vector:8001/top_similar}
      CONFIDENCE_THRESHOLD: ${CONFIDENCE_THRESHOLD:-0.55}
      TAG_ANSWER_URL: ${TAG_ANSWER_URL:-https://raw.githubusercontent.com/Synesis-IT-PLC/ec-faq-bot/development/full_dataset/tag_answer.json}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TAG_ANSWER_ALLOW_LOCAL_FALLBACK: ${TAG_ANSWER_ALLOW_LOCAL_FALLBACK:-true}
      TAG_ANSWER_REFRESH_SECONDS: ${TAG_ANSWER_REFRESH_SECONDS:-0}
      TAG_ANSWER_PATH: /data/tag_answer.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_TRANSPORT: http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      MCP_PATH: /mcp
    volumes:
      - ./data:/data
    depends_on:
      ec-conversational-vector:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-X", "POST", "http://localhost:9000/mcp", "-H", "Content-Type: application/json", "-H", "Accept: application/json, text/event-stream", "-d", "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"initialize\",\"params\":{\"protocolVersion\":\"2025-06-18\",\"capabilities\":{},\"clientInfo\":{\"name\":\"healthcheck\",\"version\":\"1\"}}}" ]
      interval: 15s
      timeout: 5s
      retries: 5

  ec-conversational-chatbot:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: ec-conversational-chatbot
    environment:
      LLAMA_BASE_URL: ${LLAMA_BASE_URL:-http://172.31.60.228:8080/v1}
      LLAMA_MODEL: ${LLAMA_MODEL:-local-model}
      LLAMA_REASONING_EFFORT: ${LLAMA_REASONING_EFFORT:-}
      MCP_SERVER_URL: http://ec-conversational-mcp:9000/mcp
      MAX_HISTORY_TURNS: ${MAX_HISTORY_TURNS:-12}
      SESSION_DB_PATH: ${SESSION_DB_PATH:-/data/sessions.db}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      SESSION_SWEEP_MINUTES: ${SESSION_SWEEP_MINUTES:-10}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./static:/app/static:ro
      - chat-sessions:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ec-conversational-mcp:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: ec-conversational-caddy
    environment:
      CHATBOT_URL: ${CHATBOT_URL:-ec-conversational-chatbot:8000}
      ASR_URL: ${ASR_URL:-http://172.31.60.228:8006}
      OCR_URL: ${OCR_URL:-http://172.31.60.228:8006}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PORT:-9100}:80"
    depends_on:
      ec-conversational-chatbot:
        condition: service_healthy
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ec-conversational-ngrok
    profiles: [ "public" ]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: http caddy:80
    ports:
      - "4040:4040"
    depends_on:
      - caddy
    restart: on-failure:3

networks:
  default:
    name: ec-conversational-net

volumes:
  chat-sessions:
  pgvector-data:
  vector-model-cache:
