<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f6b45" />
  <title>নির্বাচন কমিশন চ্যাটবট</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/composer.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/answer.css" />
  <link rel="stylesheet" href="css/voice.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="avatar avatar-bot" aria-hidden="true">🗳️</div>
        <div class="header-text">
          <div class="header-title">নির্বাচন কমিশন সহায়ক</div>
          <div class="header-subtitle">AI চ্যাটবট</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="reset-btn" class="icon-btn" title="নতুন কথোপকথন শুরু করুন" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 .49-6.5L1 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <button id="jump-btn" class="jump-btn" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <polyline points="19 12 12 19 5 12"></polyline>
      </svg>
      সর্বশেষ বার্তায় যান
    </button>

    <form id="chat-form" class="composer">
      <textarea
        id="question-input"
        class="composer-input"
        placeholder="আপনার প্রশ্ন লিখুন..."
        rows="1"
      ></textarea>
      <button id="mic-btn" class="mic-btn" type="button" aria-label="ভয়েস মোড" title="ভয়েস মোড শুরু করুন">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </form>
  </div>

  <div id="voice-overlay" class="voice-overlay" hidden>
    <div class="voice-top">
      <div id="voice-status" class="voice-status">মাইক্রোফোন প্রস্তুত করা হচ্ছে…</div>
      <div id="voice-debug" class="voice-debug" hidden></div>
    </div>
    <div class="voice-orb-wrap">
      <div id="voice-orb" class="voice-orb"></div>
    </div>
    <div id="voice-transcript" class="voice-transcript"></div>
    <div class="voice-controls">
      <button id="voice-mute-btn" class="voice-ctrl-btn" type="button" aria-label="মিউট">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button id="voice-close-btn" class="voice-ctrl-btn close-btn" type="button" aria-label="বন্ধ করুন">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
