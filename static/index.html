<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f6b45" />
  <title>নির্বাচন কমিশন চ্যাটবট</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <style>
  :root {
    --green: #0f6b45;
    --green-dark: #0a4f33;
    --green-soft: #eaf4ef;
    --green-line: #cfe4d9;
    --red: #f42a41;
    --amber: #b26a00;
    --bg: #f4f6f5;
    --panel: #ffffff;
    --text: #1c2521;
    --muted: #5f6f68;
    --line: #e2e7e4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  /*
   * position: fixed, not just overflow: hidden -- on iOS Safari, focusing an
   * input auto-scrolls the *page* to keep it above the keyboard, and that
   * scroll happens at the visual-viewport level, bypassing normal overflow
   * rules. Pinning html/body removes any document-level scroll surface for
   * it to act on; syncAppHeight() below also snaps window scroll back to
   * (0, 0) as a second line of defense.
   */
  html, body { height: 100%; overflow: hidden; position: fixed; width: 100%; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans Bengali", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    /*
     * dvh, not vh: on mobile browsers 100vh includes the area behind the
     * URL bar, so the app renders taller than the visible screen and the
     * composer at the bottom ends up off-screen -- unreachable, because
     * html/body have overflow: hidden. dvh tracks the actually-visible
     * height. The vh line stays first as a fallback for old browsers.
     */
    height: calc(100vh - 32px);
    height: calc(100dvh - 32px);
    height: calc(var(--app-h, 100dvh) - 32px);
    max-width: 860px;
    margin: 16px auto;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    border-radius: 18px;

    overflow: hidden;
    box-shadow: 0 2px 6px rgba(15, 40, 30, 0.05),
                0 12px 32px rgba(15, 40, 30, 0.08);
  }

  .header {
    background: var(--green);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: none;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1.15rem;
    flex: none;
  }
  .avatar-bot { background: rgba(255,255,255,0.18); }
  .header-text { min-width: 0; }
  .header-title {
    font-size: 1rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-subtitle { font-size: 0.75rem; opacity: 0.85; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: none; color: #fff;
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.28); }
  .icon-btn svg { width: 17px; height: 17px; }

  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; gap: 10px; max-width: 100%; }
  .row.user { flex-direction: row-reverse; }
  .row .avatar { width: 30px; height: 30px; font-size: 0.9rem; }
  .row.bot .avatar { background: var(--green-soft); }
  .row.user .avatar { background: var(--green); color: #fff; }

  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 0.93rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--green);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: #fff;
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .think {
    font-size: 0.78rem;
    background: #f2f5f4;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .think > summary {
    cursor: pointer;
    padding: 5px 9px;
    color: var(--muted);
    list-style: none;
    user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .think > summary::-webkit-details-marker { display: none; }
  .think > summary::before { content: "\25B8"; font-size: 0.65rem; }
  .think[open] > summary::before { content: "\25BE"; }
  .think-body {
    padding: 0 9px 8px;
    max-height: 160px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 0.71rem;
    line-height: 1.5;
    color: var(--muted);
    white-space: pre-wrap;
  }

  .tool {
    border: 1px solid var(--green-line);
    border-left: 3px solid var(--green);
    background: var(--green-soft);
    border-radius: 7px;
    margin-bottom: 8px;
    font-size: 0.78rem;
  }
  .tool.running {
    animation: tool-glow 1.2s ease-in-out infinite;
  }
  @keyframes tool-glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(15, 107, 69, 0.35); }
    50%      { box-shadow: 0 0 0 5px rgba(15, 107, 69, 0); }
  }
  .tool > summary {
    cursor: pointer;
    padding: 7px 10px;
    list-style: none;
    user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary::before { content: "\25B8"; font-size: 0.65rem; color: var(--green-dark); }
  .tool[open] > summary::before { content: "\25BE"; }
  .tool-body { padding: 0 10px 8px; }
  .tool-name {
    font-family: var(--mono);
    font-weight: 600;
    color: var(--green-dark);
    display: flex; align-items: center; gap: 5px;
  }
  .tool.running .tool-name::after {
    content: "";
    width: 9px; height: 9px;
    border: 2px solid var(--green);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-args {
    display: block;
    font-family: var(--mono);
    font-size: 0.71rem;
    color: #47574f;
    margin-top: 3px;
    word-break: break-all;
  }
  .tool-res {
    display: block;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed var(--green-line);
    font-size: 0.72rem;
    font-family: var(--mono);
  }
  .tool-res .ok { color: var(--green-dark); font-weight: 600; }
  .tool-res .weak { color: var(--amber); font-weight: 600; }
  .tool-res .bad { color: var(--red); font-weight: 600; }
  .cands { margin-top: 4px; color: var(--muted); font-size: 0.69rem; }
  .cands div { padding-left: 10px; }

  .stream-err { color: var(--red); font-size: 0.78rem; display: block; margin-top: 6px; }
  .timing {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 7px;
    font-variant-numeric: tabular-nums;
    cursor: help;
  }
  .cursor::after {
    content: "\258B";
    animation: blink 1s steps(2, start) infinite;
    opacity: 0.65;
  }
  @keyframes blink { to { visibility: hidden; } }

  .composer {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: #fff;
  }
  .composer-input {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    font: inherit;
    font-size: 0.93rem;
    line-height: 1.5;
    outline: none;
  }
  .composer-input:focus { border-color: var(--green); }
  .send-btn {
    flex: none;
    width: 42px; height: 42px;
    border: none; border-radius: 50%;
    background: var(--green);
    color: #fff;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .send-btn:hover:not(:disabled) { background: var(--green-dark); }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .send-btn svg { width: 19px; height: 19px; }

  .mic-btn {
    flex: none;
    width: 42px; height: 42px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: #fff;
    color: var(--green);
    cursor: pointer;
    display: grid; place-items: center;
  }
  .mic-btn:hover:not(:disabled) { background: var(--green-soft); }
  .mic-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .mic-btn svg { width: 19px; height: 19px; }

  @media (max-width: 600px) {
    .bubble { max-width: 85%; }
    .app {
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      height: var(--app-h, 100dvh);
      margin: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .icon-btn { width: 44px; height: 44px; }
    .icon-btn svg { width: 20px; height: 20px; }
    .send-btn { width: 44px; height: 44px; }
    .mic-btn { width: 44px; height: 44px; }
    .composer-input {
      font-size: 16px;
      padding: 12px 14px;
    }
    .composer {
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    .header { padding: 10px 14px; }
  }

  .answer p { margin: 0 0 0.6em; }
  .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 0.6em; padding-left: 1.4em; }
  .answer li { margin-bottom: 0.2em; }
  .answer h3, .answer h4, .answer h5, .answer h6 {
    margin: 0.6em 0 0.3em;
    font-size: 1em;
    font-weight: 700;
  }
  .answer h3:first-child, .answer h4:first-child { margin-top: 0; }
  .answer strong { font-weight: 700; }
  .answer em { font-style: italic; }
  .answer code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: var(--green-soft);
    border: 1px solid var(--green-line);
    border-radius: 4px;
    padding: 0.05em 0.35em;
  }
  .row.user .answer code { background: rgba(255,255,255,0.18); border-color: transparent; }
  .answer pre {
    background: #1e2723;
    color: #e6efe9;
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0 0 0.6em;
  }
  .answer pre code { background: none; border: none; padding: 0; color: inherit; }
  .answer .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; }
  .answer a { color: var(--green-dark); text-decoration: underline; }
  .row.user .answer a { color: #fff; }

  .retry-btn {
    margin-top: 6px;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    font-size: 0.78rem;
    cursor: pointer;
  }
  .retry-btn:hover { background: var(--green-soft); border-color: var(--green-line); }

  /* --------------------------------------------------- voice mode overlay */

  .voice-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: radial-gradient(circle at 50% 30%, #163326 0%, #0b1d15 55%, #071410 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    color: #fff;
    padding: calc(20px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
  }
  .voice-overlay[hidden] { display: none; }

  .voice-top {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .voice-status {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.02em;
    min-height: 1.3em;
    text-align: center;
  }

  .voice-orb-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .voice-orb {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #4fd18b, var(--green) 55%, var(--green-dark) 100%);
    box-shadow: 0 0 40px 10px rgba(45, 200, 130, 0.35);
    transition: transform 0.09s ease-out, box-shadow 0.2s ease-out, background 0.3s ease;
    transform: scale(1);
  }
  .voice-orb.thinking {
    background: radial-gradient(circle at 35% 30%, #ffd27a, var(--amber) 55%, #8a5000 100%);
    box-shadow: 0 0 40px 10px rgba(255, 178, 60, 0.3);
    animation: voice-think-spin 1.1s linear infinite;
  }
  .voice-orb.speaking {
    animation: voice-speak-pulse 0.6s ease-in-out infinite;
  }
  .voice-orb.error {
    background: radial-gradient(circle at 35% 30%, #ff8f8f, var(--red) 55%, #7a0f1e 100%);
    box-shadow: 0 0 40px 10px rgba(244, 42, 65, 0.3);
  }
  @keyframes voice-think-spin {
    0%, 100% { transform: scale(0.94) rotate(0deg); }
    50% { transform: scale(1.02) rotate(180deg); }
  }
  @keyframes voice-speak-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .voice-transcript {
    max-width: 640px;
    text-align: center;
    font-size: 1.02rem;
    line-height: 1.6;
    color: rgba(255,255,255,0.92);
    min-height: 1.6em;
    padding: 0 12px;
    margin-top: 18px;
  }

  .voice-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;
    width: 100%;
  }
  .voice-ctrl-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.08);
    color: #fff;
    display: grid; place-items: center;
    cursor: pointer;
  }
  .voice-ctrl-btn:hover { background: rgba(255,255,255,0.16); }
  .voice-ctrl-btn svg { width: 22px; height: 22px; }
  .voice-ctrl-btn.close-btn { background: rgba(244, 42, 65, 0.85); border-color: transparent; }
  .voice-ctrl-btn.close-btn:hover { background: var(--red); }
  .voice-ctrl-btn.muted { background: rgba(244, 42, 65, 0.85); border-color: transparent; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="avatar avatar-bot" aria-hidden="true">🗳️</div>
        <div class="header-text">
          <div class="header-title">নির্বাচন কমিশন সহায়ক</div>
          <div class="header-subtitle">AI চ্যাটবট</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="reset-btn" class="icon-btn" title="নতুন কথোপকথন শুরু করুন" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 .49-6.5L1 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <form id="chat-form" class="composer">
      <textarea
        id="question-input"
        class="composer-input"
        placeholder="আপনার প্রশ্ন লিখুন..."
        rows="1"
      ></textarea>
      <button id="mic-btn" class="mic-btn" type="button" aria-label="ভয়েস মোড" title="ভয়েস মোড শুরু করুন">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </form>
  </div>

  <div id="voice-overlay" class="voice-overlay" hidden>
    <div class="voice-top">
      <div id="voice-status" class="voice-status">মাইক্রোফোন প্রস্তুত করা হচ্ছে…</div>
    </div>
    <div class="voice-orb-wrap">
      <div id="voice-orb" class="voice-orb"></div>
    </div>
    <div id="voice-transcript" class="voice-transcript"></div>
    <div class="voice-controls">
      <button id="voice-mute-btn" class="voice-ctrl-btn" type="button" aria-label="মিউট">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
      <button id="voice-close-btn" class="voice-ctrl-btn close-btn" type="button" aria-label="বন্ধ করুন">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script>
  /*
   * Base URL of the chatbot API. Empty means same-origin, which is what
   * this default supports when the page is served by the FastAPI app
   * itself (StaticFiles at /static) -- leave it as '' for that case.
   *
   * When this file is deployed separately (e.g. to Vercel), vercel.json's
   * buildCommand patches this line at build time from the NGROK_URL
   * environment variable set in the Vercel project, so the public tunnel
   * URL never has to be hardcoded or committed. The backend must also
   * allow the Vercel origin via CORS_ALLOW_ORIGINS and be reachable over
   * HTTPS, since an HTTPS page cannot call a plain HTTP API.
   */
  const API_BASE = '';

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderInline(text) {
    let out = escapeHtml(text);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    out = out.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
    out = out.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );
    return out;
  }

  function renderMarkdown(source) {
    const lines = source.replace(/\r\n/g, '\n').split('\n');
    const html = [];
    let paragraph = [];
    let list = null;
    let inCode = false;
    let codeLines = [];

    function flushParagraph() {
      if (paragraph.length) {
        html.push('<p>' + renderInline(paragraph.join(' ')) + '</p>');
        paragraph = [];
      }
    }

    function flushList() {
      if (list) {
        html.push('</' + list + '>');
        list = null;
      }
    }

    for (const rawLine of lines) {
      const line = rawLine.trimEnd();

      if (line.trim().startsWith('```')) {
        if (inCode) {
          html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
          codeLines = [];
          inCode = false;
        } else {
          flushParagraph();
          flushList();
          inCode = true;
        }
        continue;
      }
      if (inCode) {
        codeLines.push(rawLine);
        continue;
      }

      if (line.trim() === '') {
        flushParagraph();
        continue;
      }

      const heading = line.match(/^(#{1,4})\s+(.*)$/);
      if (heading) {
        flushParagraph();
        flushList();
        const level = heading[1].length + 2;
        html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
        continue;
      }

      const ordered = line.match(/^\s*[0-9০-৯]+[.)]\s+(.*)$/);
      const bulleted = line.match(/^\s*[-*•]\s+(.*)$/);
      if (ordered || bulleted) {
        flushParagraph();
        const tag = ordered ? 'ol' : 'ul';
        if (list !== tag) {
          flushList();
          html.push('<' + tag + '>');
          list = tag;
        }
        html.push('<li>' + renderInline((ordered || bulleted)[1]) + '</li>');
        continue;
      }

      flushList();
      paragraph.push(line);
    }

    flushParagraph();
    flushList();
    if (inCode && codeLines.length) {
      html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
    }

    return html.join('');
  }

  const messagesEl = document.getElementById('messages');
  const formEl = document.getElementById('chat-form');
  const inputEl = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');
  const micBtn = document.getElementById('mic-btn');

  let sessionId = localStorage.getItem('ec_faq_session_id') || null;
  let busy = false;

  function el(tag, cls, parent) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (parent) parent.appendChild(node);
    return node;
  }

  const BENGALI_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

  function toBengaliDigits(str) {
    return String(str).replace(/[0-9]/g, (d) => BENGALI_DIGITS[+d]);
  }

  function formatSeconds(ms) {
    return toBengaliDigits((ms / 1000).toFixed(1));
  }

  const nearBottom = () =>
    messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 70;

  function stickToBottom(wasNear) {
    if (wasNear) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addRow(who) {
    const row = el('div', 'row ' + who, messagesEl);
    const avatar = el('div', 'avatar avatar-' + who, row);
    avatar.textContent = who === 'user' ? '\u{1F464}' : '\u{1F5F3}️';
    avatar.setAttribute('aria-hidden', 'true');
    const bubble = el('div', 'bubble', row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addUserMessage(text) {
    addRow('user').textContent = text;
  }

  function renderMath(container) {
    renderMathInElement(container, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false },
      ],
      throwOnError: false,
    });
  }

  function renderAnswer(answerEl, raw) {
    answerEl.innerHTML = renderMarkdown(raw);
    renderMath(answerEl);
  }

  function addRetryButton(bubble, text) {
    const btn = el('button', 'retry-btn', bubble);
    btn.type = 'button';
    btn.textContent = '↻ আবার চেষ্টা করুন';
    btn.addEventListener('click', () => {
      bubble.remove();
      ask(text);
    });
  }

  async function ask(text) {
    const bubble = addRow('bot');

    const think = el('details', 'think', bubble);
    const thinkSummary = el('summary', null, think);
    thinkSummary.textContent = 'চিন্তা করছে…';
    const thinkBody = el('div', 'think-body', think);
    const toolsEl = el('div', 'tools', bubble);
    const answerEl = el('div', 'answer cursor', bubble);

    think.style.display = 'none';
    think.open = true;

    let chip = null;
    let answerStarted = false;
    let toolRan = false;

    // Timing, so the wait after a tool call is visible rather than a mystery.
    const startedAt = performance.now();
    let toolResultAt = null;
    let firstTokenAt = null;
    let answerRaw = '';
    let failed = false;
    let finalReply = '';

    const handle = (ev) => {
      const wasNear = nearBottom();

      switch (ev.type) {
        case 'start':
          sessionId = ev.session_id;
          localStorage.setItem('ec_faq_session_id', sessionId);
          break;

        case 'reasoning':
          think.style.display = '';
          thinkBody.textContent += ev.text;
          thinkBody.scrollTop = thinkBody.scrollHeight;
          /*
           * After a tool result the model runs a second thinking pass before
           * the first answer token, which is the bulk of the wait on a
           * reasoning model. Without this the block stayed collapsed under a
           * static label and the UI looked frozen for that whole stretch.
           */
          if (!answerStarted) {
            thinkSummary.textContent = toolRan
              ? 'উত্তর তৈরি করছে…'
              : 'চিন্তা করছে…';
          }
          break;

        case 'tool_call': {
          toolRan = true;
          collapseThinking();
          chip = el('details', 'tool running', toolsEl);
          const summary = el('summary', null, chip);
          el('span', 'tool-name', summary).textContent = '\u{1F527} tool';
          const body = el('div', 'tool-body', chip);
          let args = ev.arguments || '';
          try {
            args = JSON.stringify(JSON.parse(args));
          } catch (e) {

          }
          el('code', 'tool-args', body).textContent = args;
          break;
        }

        case 'tool_result': {
          toolResultAt = performance.now();
          if (!chip) break;
          chip.classList.remove('running');
          const body = chip.querySelector('.tool-body');
          const res = el('span', 'tool-res', body);

          if (ev.error) {
            const bad = el('span', 'bad', res);
            bad.textContent = '✗ ' + ev.error;
            break;
          }

          const score = ev.best_score == null ? '?' : Number(ev.best_score).toFixed(3);
          const verdict = el('span', ev.confident ? 'ok' : 'weak', res);
          verdict.textContent =
            (ev.confident ? '✓ confident' : '⚠ low confidence') +
            ' · ' + (ev.best_tag || '-') +
            ' · ' + score +
            (ev.threshold != null ? ' / ' + Number(ev.threshold).toFixed(2) : '');

          if (ev.candidates && ev.candidates.length) {
            const cands = el('div', 'cands', res);
            el('div', null, cands).textContent =
              ev.alternatives + ' other candidate(s):';
            ev.candidates.forEach((c) => {
              const line = el('div', null, cands);
              const s = c.score == null ? '?' : Number(c.score).toFixed(3);
              line.textContent = '· ' + c.tag + '  ' + s;
            });
          }
          break;
        }

        case 'token':
          if (!answerStarted) {
            answerStarted = true;
            firstTokenAt = performance.now();
            collapseThinking();
          }
          answerRaw += ev.text;
          renderAnswer(answerEl, answerRaw);
          break;

        case 'error':
          failed = true;
          el('span', 'stream-err', bubble).textContent =
            '⚠ ' + (ev.message || 'stream error');
          break;

        case 'done': {
          if (!answerRaw.trim()) {
            answerRaw = ev.reply || '(কোনো উত্তর পাওয়া যায়নি)';
            renderAnswer(answerEl, answerRaw);
          }
          finalReply = ev.reply || answerRaw;

          const total = performance.now() - startedAt;
          const timing = el('div', 'timing', bubble);
          timing.textContent = '\u23F1 ' + formatSeconds(total) + ' সেকেন্ড';

          // Breakdown on hover: most of a slow turn is the model thinking
          // after the tool result, which is otherwise invisible.
          const parts = [];
          if (toolResultAt !== null) {
            parts.push('তথ্য খোঁজা: ' + formatSeconds(toolResultAt - startedAt) + ' সে.');
          }
          if (firstTokenAt !== null) {
            parts.push('উত্তর শুরু: ' + formatSeconds(firstTokenAt - startedAt) + ' সে.');
            parts.push('উত্তর লেখা: ' + formatSeconds(performance.now() - firstTokenAt) + ' সে.');
          }
          if (parts.length) timing.title = parts.join(' · ');
          break;
        }
      }

      stickToBottom(wasNear);
    };

    function collapseThinking() {
      if (think.style.display === 'none') return;
      think.open = false;
      thinkSummary.textContent = 'চিন্তার ধাপ দেখুন';
    }

    try {
      const res = await fetch(API_BASE + '/api/v1/chat/stream', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          /*
           * ngrok's free tier serves a browser interstitial warning page
           * (ERR_NGROK_6024) to any request carrying a browser User-Agent,
           * so every API call from a real browser would get HTML back
           * instead of JSON. This header opts out. Harmless when API_BASE
           * is not an ngrok tunnel.
           */
          'ngrok-skip-browser-warning': 'true',
        },
        body: JSON.stringify({
          session_id: sessionId,
          message: text,
        }),
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const frames = buffer.split('\n\n');
        buffer = frames.pop();

        for (const frame of frames) {
          for (const line of frame.split('\n')) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6);
            if (raw === '[DONE]') continue;
            try {
              handle(JSON.parse(raw));
            } catch (e) {

            }
          }
        }
      }
    } catch (err) {
      failed = true;
      el('span', 'stream-err', bubble).textContent =
        'দুঃখিত, সার্ভারের সাথে সংযোগ করা যায়নি।';
    } finally {
      answerEl.classList.remove('cursor');
      if (!thinkBody.textContent.trim()) think.style.display = 'none';
      if (failed) addRetryButton(bubble, text);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    return { text: finalReply, failed };
  }

  async function submit() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    addUserMessage(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';

    try {
      await ask(text);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    submit();
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  /* ------------------------------------------------- visible-height sync */

  /*
   * dvh handles the URL bar, but iOS Safari's on-screen keyboard overlays the
   * page instead of shrinking dvh, which would leave the composer hidden
   * behind the keyboard. visualViewport is the only thing that reports the
   * genuinely visible height in both cases.
   */
  function syncAppHeight() {
    const vv = window.visualViewport;
    if (!vv) return;
    document.documentElement.style.setProperty('--app-h', vv.height + 'px');
    /*
     * iOS Safari scrolls the page itself to keep a focused input above the
     * keyboard, which -- with html/body now pinned via position: fixed --
     * just leaves blank space where the page tried and failed to scroll.
     * Snapping back to (0, 0) on every visual-viewport change (which fires
     * exactly when that auto-scroll attempt happens) cancels it out.
     */
    window.scrollTo(0, 0);
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncAppHeight);
    window.visualViewport.addEventListener('scroll', syncAppHeight);
    syncAppHeight();
  }

  // Keep the latest message in view when the keyboard opens over the page.
  inputEl.addEventListener('focus', () => {
    setTimeout(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, 250);
  });

  /* ------------------------------------------------------- voice mode -- */
  /*
   * A ChatGPT-style full-screen voice mode: tapping the mic button opens an
   * overlay that listens continuously, auto-detects when the user stops
   * talking (via a Web Audio analyser, not a manual stop button), sends the
   * transcript through the normal chat pipeline, then speaks the reply back
   * via TTS and starts listening again -- a hands-free loop until closed.
   */

  async function transcribe(blob) {
    /*
     * Caddy proxies /asr* straight to the ASR service, so this only ever
     * talks to the same origin as the chat API -- no second URL to configure,
     * and no mixed-content problem when the page is served over HTTPS.
     */
    const form = new FormData();
    const ext = (blob.type || '').includes('mp4') ? 'mp4' : 'webm';
    form.append('file', blob, 'recording.' + ext);
    form.append('model_type', 'zipformer');

    const res = await fetch(API_BASE + '/asr/upload', {
      method: 'POST',
      headers: { 'ngrok-skip-browser-warning': 'true' },
      body: form,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    return ((data.output && data.output[0] && data.output[0].source) || '').trim();
  }

  /*
   * Number/domain-to-words conversion for speech.
   *
   * The LLM is deliberately left free to write digits (asking it to spell
   * numbers out itself was tried and reverted -- it reliably gets the VALUE
   * right with digits, but occasionally hallucinates non-Bangla fragments
   * (e.g. Cyrillic) when asked to spell tricky numbers like 115 as words).
   * Converting digits to words here instead is deterministic: same input,
   * same output, no model involved, so there's nothing for it to get wrong.
   */

  const BN_DIGIT_MAP = { '০': '0', '১': '1', '২': '2', '৩': '3', '৪': '4', '৫': '5', '৬': '6', '৭': '7', '৮': '8', '৯': '9' };
  const normalizeDigits = (s) => s.replace(/[০-৯]/g, (d) => BN_DIGIT_MAP[d]);

  // Bangla has a distinct word for every number 0-99 (not composed from
  // tens+ones like English), so this has to be a full lookup table.
  const BN_TWO_DIGIT = [
    'শূন্য', 'এক', 'দুই', 'তিন', 'চার', 'পাঁচ', 'ছয়', 'সাত', 'আট', 'নয়', 'দশ',
    'এগারো', 'বারো', 'তেরো', 'চৌদ্দ', 'পনেরো', 'ষোলো', 'সতেরো', 'আঠারো', 'উনিশ', 'বিশ',
    'একুশ', 'বাইশ', 'তেইশ', 'চব্বিশ', 'পঁচিশ', 'ছাব্বিশ', 'সাতাশ', 'আটাশ', 'ঊনত্রিশ', 'ত্রিশ',
    'একত্রিশ', 'বত্রিশ', 'তেত্রিশ', 'চৌত্রিশ', 'পঁয়ত্রিশ', 'ছত্রিশ', 'সাঁইত্রিশ', 'আটত্রিশ', 'ঊনচল্লিশ', 'চল্লিশ',
    'একচল্লিশ', 'বিয়াল্লিশ', 'তেতাল্লিশ', 'চুয়াল্লিশ', 'পঁয়তাল্লিশ', 'ছেচল্লিশ', 'সাতচল্লিশ', 'আটচল্লিশ', 'ঊনপঞ্চাশ', 'পঞ্চাশ',
    'একান্ন', 'বাহান্ন', 'তিপ্পান্ন', 'চুয়ান্ন', 'পঞ্চান্ন', 'ছাপ্পান্ন', 'সাতান্ন', 'আটান্ন', 'ঊনষাট', 'ষাট',
    'একষট্টি', 'বাষট্টি', 'তেষট্টি', 'চৌষট্টি', 'পঁয়ষট্টি', 'ছেষট্টি', 'সাতষট্টি', 'আটষট্টি', 'ঊনসত্তর', 'সত্তর',
    'একাত্তর', 'বাহাত্তর', 'তিয়াত্তর', 'চুয়াত্তর', 'পঁচাত্তর', 'ছিয়াত্তর', 'সাতাত্তর', 'আটাত্তর', 'ঊনআশি', 'আশি',
    'একাশি', 'বিরাশি', 'তিরাশি', 'চুরাশি', 'পঁচাশি', 'ছিয়াশি', 'সাতাশি', 'আটাশি', 'ঊননব্বই', 'নব্বই',
    'একানব্বই', 'বিরানব্বই', 'তিরানব্বই', 'চুরানব্বই', 'পঁচানব্বই', 'ছিয়ানব্বই', 'সাতানব্বই', 'আটানব্বই', 'নিরানব্বই',
  ];

  function banglaHundredsToWords(n) {
    const h = Math.floor(n / 100);
    const r = n % 100;
    let out = '';
    if (h > 0) out += BN_TWO_DIGIT[h] + 'শ' + (r > 0 ? ' ' : '');
    if (r > 0) out += BN_TWO_DIGIT[r];
    return out.trim();
  }

  // Bangla groups digits as crore/lakh/thousand/hundred (2-2-2-3), not the
  // Western 3-3-3 (million/billion) grouping.
  function numberToBanglaWords(n) {
    if (n === 0) return 'শূন্য';
    if (n < 0) return 'ঋণাত্মক ' + numberToBanglaWords(-n);
    const parts = [];
    const crore = Math.floor(n / 1e7); n %= 1e7;
    const lakh = Math.floor(n / 1e5); n %= 1e5;
    const thousand = Math.floor(n / 1e3); n %= 1e3;
    if (crore) parts.push(BN_TWO_DIGIT[crore] + ' কোটি');
    if (lakh) parts.push(BN_TWO_DIGIT[lakh] + ' লক্ষ');
    if (thousand) parts.push(BN_TWO_DIGIT[thousand] + ' হাজার');
    if (n) parts.push(banglaHundredsToWords(n));
    return parts.join(' ').trim();
  }

  const BN_ORDINAL = [
    '', 'প্রথম', 'দ্বিতীয়', 'তৃতীয়', 'চতুর্থ', 'পঞ্চম', 'ষষ্ঠ', 'সপ্তম', 'অষ্টম', 'নবম', 'দশম',
    'একাদশ', 'দ্বাদশ', 'ত্রয়োদশ', 'চতুর্দশ', 'পঞ্চদশ', 'ষোড়শ', 'সপ্তদশ', 'অষ্টাদশ', 'ঊনবিংশ', 'বিংশ',
  ];
  const banglaOrdinalWord = (n) => (n >= 1 && n < BN_ORDINAL.length ? BN_ORDINAL[n] : numberToBanglaWords(n) + 'তম');

  // Days of the month: 1st-4th are irregular idioms, 5th+ is regular
  // (cardinal word + whichever suffix -ই/-শে the source text already used).
  const BN_DATE_ORDINAL_SPECIAL = { 1: 'পয়লা', 2: 'দোসরা', 3: 'তেসরা', 4: 'চৌঠা' };
  function banglaDateOrdinalWord(n, suffix) {
    if (BN_DATE_ORDINAL_SPECIAL[n]) return BN_DATE_ORDINAL_SPECIAL[n];
    const word = numberToBanglaWords(n);
    // e.g. পঁচিশ + শে would double the শ (পঁচিশশে) -- the real word elides
    // it to পঁচিশে, same for ত্রিশে/বিশে etc.
    if (suffix === 'শে' && word.endsWith('শ')) return word + 'ে';
    return word + suffix;
  }

  const EN_ORDINAL = [
    '', 'first', 'second', 'third', 'fourth', 'fifth', 'sixth', 'seventh', 'eighth', 'ninth', 'tenth',
    'eleventh', 'twelfth', 'thirteenth', 'fourteenth', 'fifteenth', 'sixteenth', 'seventeenth', 'eighteenth', 'nineteenth', 'twentieth',
  ];
  const englishOrdinalWord = (n) => (n >= 1 && n < EN_ORDINAL.length ? EN_ORDINAL[n] : n + 'th');

  // Long digit runs (NID numbers, mobile numbers) or anything near "নম্বর
  // /কল/হেল্পলাইন" read as a magnitude would be nonsense -- read digit by
  // digit instead, same convention as a phone number in any language.
  function digitByDigit(digits) {
    return normalizeDigits(digits).split('').map((d) => BN_TWO_DIGIT[+d]).join(' ');
  }

  const EN_DIGIT_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  const digitByDigitEnglish = (digits) => digits.split('').map((d) => EN_DIGIT_WORDS[+d]).join(' ');

  function convertNumbersForSpeech(text) {
    let out = text;

    // Known domain the FAQ data repeats often; give it a clean phonetic
    // reading instead of leaving Latin letters for the Bangla voice model.
    out = out.replace(/services\.nidw\.gov\.bd/gi, 'সার্ভিসেস ডট এনআইডিডাব্লিউ ডট গভ ডট বিডি');
    // Any other bare domain-looking token: break it on the dots so it isn't
    // read as one long run-on word.
    out = out.replace(/\b[a-zA-Z][a-zA-Z0-9-]*(?:\.[a-zA-Z]{2,})+\b/g, (m) => m.split('.').join(' ডট '));

    // Date ordinals: digits directly followed by -লা/-রা/-শে/-ঠা/-ই.
    out = out.replace(/([০-৯]+|\d+)(লা|রা|শে|ঠা|ই)/g, (m, num, suffix) =>
      banglaDateOrdinalWord(parseInt(normalizeDigits(num), 10), suffix)
    );
    // General ordinals: ১ম, ২য়, ৩য়, ৪র্থ, ৫ম, ৬ষ্ঠ, ...
    out = out.replace(/([০-৯]+|\d+)(ম|য়|র্থ|ষ্ঠ)/g, (m, num) =>
      banglaOrdinalWord(parseInt(normalizeDigits(num), 10))
    );
    // English ordinals: 1st, 2nd, 3rd, 4th, ...
    out = out.replace(/\b(\d+)(st|nd|rd|th)\b/gi, (m, num) => englishOrdinalWord(parseInt(num, 10)));

    // Helpline/ID-style numbers: long runs, or short runs next to a word
    // like "নম্বর"/"কল"/"call"/"number" -- read digit by digit (like a real
    // phone number in any language), not as one big magnitude.
    out = out.replace(/([০-৯]{6,}|\d{6,})/g, (m) => digitByDigit(m));
    out = out.replace(/(নম্বর|নম্বরে|নম্বরটি|কল করে|কল করুন|হেল্পলাইন|হটলাইন)\s*([০-৯]+|\d+)/g, (m, label, num) =>
      label + ' ' + digitByDigit(num)
    );
    out = out.replace(/([০-৯]+|\d+)\s*(নম্বরে|নম্বরটি|নম্বর)/g, (m, num, label) => digitByDigit(num) + ' ' + label);
    out = out.replace(/\b(call|number|helpline|hotline|dial)\b\s*:?\s*([0-9]+)/gi, (m, label, num) =>
      label + ' ' + digitByDigitEnglish(num)
    );
    out = out.replace(/\b([0-9]+)\s*(?=is the (?:number|helpline|hotline))/gi, (m, num) => digitByDigitEnglish(num) + ' ');

    // Whatever plain digit runs remain: read as a normal magnitude (fees,
    // ages, years, quantities).
    out = out.replace(/[০-৯]+|\d+/g, (m) => numberToBanglaWords(parseInt(normalizeDigits(m), 10)));

    return out;
  }

  // Strip markdown noise before handing text to TTS, so the voice doesn't
  // read out asterisks, hashes, or link syntax.
  function stripMarkdownForSpeech(text) {
    const plain = text
      .replace(/```[\s\S]*?```/g, ' ')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
      .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
      .replace(/[#*_>~]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
    return convertNumbersForSpeech(plain);
  }

  async function synthesizeSpeech(text) {
    /*
     * Goes through our own backend (POST /api/v1/tts), not the TTS service's
     * /v1/audio/speech directly -- that service has no CORS support, so a UI
     * hosted on a different origin (e.g. Vercel) would have the browser
     * block the request. Our backend forwards it and inherits its own
     * CORSMiddleware instead.
     */
    const res = await fetch(API_BASE + '/api/v1/tts', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'ngrok-skip-browser-warning': 'true',
      },
      body: JSON.stringify({
        input: stripMarkdownForSpeech(text).slice(0, 1000),
        voice: 'Aditi',
        response_format: 'wav',
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    if (!blob.size) throw new Error('empty TTS response');
    return URL.createObjectURL(blob);
  }

  const voiceOverlay = document.getElementById('voice-overlay');
  const voiceOrb = document.getElementById('voice-orb');
  const voiceStatus = document.getElementById('voice-status');
  const voiceTranscript = document.getElementById('voice-transcript');
  const voiceMuteBtn = document.getElementById('voice-mute-btn');
  const voiceCloseBtn = document.getElementById('voice-close-btn');

  const VoiceMode = {
    active: false,
    muted: false,
    stream: null,
    audioCtx: null,
    analyser: null,
    levelRaf: null,
    recorder: null,
    chunks: [],
    silenceTimer: null,
    maxDurationTimer: null,
    speechStarted: false,
    playerEl: null,
    speaking: false,
    speakingStartedAt: 0,
    interruptPlayback: null,
    generation: 0, // bumped on close, so in-flight async work becomes a no-op

    setStatus(text) {
      voiceStatus.textContent = text || '';
    },

    setOrbState(state) {
      voiceOrb.classList.remove('thinking', 'speaking', 'error');
      if (state) voiceOrb.classList.add(state);
      voiceOrb.style.transform = '';
    },

    async open() {
      if (this.active) return;
      this.active = true;
      this.generation += 1;
      voiceOverlay.hidden = false;
      voiceTranscript.textContent = '';
      this.setOrbState(null);
      this.setStatus('মাইক্রোফোন প্রস্তুত করা হচ্ছে…');

      /*
       * "Unlock" audio playback while still inside the click handler's user
       * gesture: browsers grant autoplay permission to a media element only
       * around a gesture, but by the time a TTS reply is ready several
       * network round-trips later, that window has long closed. A media
       * element that has already started playing once (even silence, here)
       * keeps its autoplay eligibility for later .play() calls on the same
       * element, so this is created and started synchronously, before the
       * getUserMedia await below spends the gesture.
       */
      if (!this.playerEl) this.playerEl = new Audio();
      const SILENT_WAV =
        'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
      this.playerEl.src = SILENT_WAV;
      this.playerEl.play().catch(() => {});

      if (!navigator.mediaDevices || !window.MediaRecorder) {
        this.setOrbState('error');
        this.setStatus('এই ব্রাউজারে ভয়েস মোড সমর্থিত নয়।');
        return;
      }

      try {
        // Echo cancellation matters here specifically because the mic stays
        // live while the bot's own reply plays out of the speaker (see
        // listen()'s barge-in handling below) -- without it, the bot's own
        // voice leaking back into the mic would trip the barge-in detector.
        this.stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
      } catch (err) {
        this.setOrbState('error');
        this.setStatus('মাইক্রোফোন ব্যবহারের অনুমতি পাওয়া যায়নি।');
        return;
      }

      this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = this.audioCtx.createMediaStreamSource(this.stream);
      this.analyser = this.audioCtx.createAnalyser();
      this.analyser.fftSize = 512;
      source.connect(this.analyser);

      this.listen();
    },

    close() {
      if (!this.active) return;
      this.active = false;
      this.generation += 1;

      clearTimeout(this.silenceTimer);
      clearTimeout(this.maxDurationTimer);
      if (this.levelRaf) cancelAnimationFrame(this.levelRaf);

      if (this.recorder && this.recorder.state !== 'inactive') {
        try { this.recorder.stop(); } catch (e) {}
      }
      this.recorder = null;

      if (this.playerEl) {
        this.playerEl.pause();
      }
      this.speaking = false;
      this.interruptPlayback = null;

      if (this.stream) {
        this.stream.getTracks().forEach((t) => t.stop());
        this.stream = null;
      }
      if (this.audioCtx) {
        this.audioCtx.close().catch(() => {});
        this.audioCtx = null;
      }

      voiceOverlay.hidden = true;
    },

    toggleMute() {
      this.muted = !this.muted;
      voiceMuteBtn.classList.toggle('muted', this.muted);
      if (this.muted && this.recorder && this.recorder.state === 'recording') {
        this.recorder.stop();
      } else if (!this.muted && this.active && (!this.recorder || this.recorder.state !== 'recording')) {
        this.listen();
      }
      this.setStatus(this.muted ? 'মাইক্রোফোন বন্ধ আছে' : '');
    },

    // Continuously watches mic input level: waits for speech to start, then
    // auto-stops once the user has gone quiet for a beat.
    listen() {
      if (!this.active || this.muted) return;
      const myGen = this.generation;

      this.chunks = [];
      this.speechStarted = false;
      let recorder;
      try {
        recorder = new MediaRecorder(this.stream);
      } catch (err) {
        this.setOrbState('error');
        this.setStatus('রেকর্ডিং শুরু করা যায়নি।');
        return;
      }
      this.recorder = recorder;
      const mimeType = recorder.mimeType;

      recorder.addEventListener('dataavailable', (e) => {
        if (e.data && e.data.size > 0) this.chunks.push(e.data);
      });

      recorder.addEventListener('stop', () => {
        if (myGen !== this.generation) return;
        clearTimeout(this.silenceTimer);
        clearTimeout(this.maxDurationTimer);
        if (this.levelRaf) cancelAnimationFrame(this.levelRaf);
        const blob = new Blob(this.chunks, { type: mimeType });
        if (blob.size > 300 && this.speechStarted) {
          this.handleUtterance(blob, myGen);
        } else if (this.active && !this.muted) {
          this.listen(); // false start (silence-only clip) -- keep listening
        }
      });

      recorder.start();
      this.setOrbState(null);
      this.setStatus('শুনছি…');

      // autoGainControl (enabled for barge-in's echo handling) amplifies
      // quiet input, including room noise -- a threshold tuned for "any
      // audible sound" ends up triggering on fan hum, clicks, a cough. Both
      // thresholds are set higher than a bare loudness read would suggest,
      // and below they must hold for CONFIRM_MS straight (not just one
      // frame) before counting as real speech, to reject brief transients.
      const SPEECH_THRESHOLD = 0.06;
      const BARGE_IN_THRESHOLD = 0.12;
      const CONFIRM_MS = 120;
      const BARGE_IN_GRACE_MS = 400;
      const SILENCE_MS = 1200;
      const MAX_UTTERANCE_MS = 20000;
      const data = new Uint8Array(this.analyser.fftSize);
      let loudStreakStart = null;

      this.maxDurationTimer = setTimeout(() => {
        if (this.recorder && this.recorder.state === 'recording') this.recorder.stop();
      }, MAX_UTTERANCE_MS);

      const tick = () => {
        if (myGen !== this.generation || !this.recorder || this.recorder.state !== 'recording') return;
        this.analyser.getByteTimeDomainData(data);
        let sumSquares = 0;
        for (let i = 0; i < data.length; i++) {
          const v = (data[i] - 128) / 128;
          sumSquares += v * v;
        }
        const level = Math.sqrt(sumSquares / data.length);
        voiceOrb.style.transform = 'scale(' + (1 + Math.min(level * 3, 0.35)) + ')';

        const aboveThreshold = this.speaking
          ? level > BARGE_IN_THRESHOLD &&
            performance.now() - this.speakingStartedAt > BARGE_IN_GRACE_MS
          : level > SPEECH_THRESHOLD;

        if (aboveThreshold) {
          if (loudStreakStart === null) loudStreakStart = performance.now();
        } else {
          loudStreakStart = null;
        }
        const loud = aboveThreshold && performance.now() - loudStreakStart >= CONFIRM_MS;

        if (loud) {
          if (this.speaking && this.interruptPlayback) {
            this.interruptPlayback();
            this.interruptPlayback = null;
            this.setOrbState(null);
            this.setStatus('শুনছি…');
          }
          this.speechStarted = true;
          clearTimeout(this.silenceTimer);
          this.silenceTimer = setTimeout(() => {
            if (this.recorder && this.recorder.state === 'recording') this.recorder.stop();
          }, SILENCE_MS);
        }

        this.levelRaf = requestAnimationFrame(tick);
      };
      this.levelRaf = requestAnimationFrame(tick);
    },

    async handleUtterance(blob, myGen) {
      this.setOrbState('thinking');
      this.setStatus('শুনছি থেকে লিখছে…');
      let text = '';
      try {
        text = await transcribe(blob);
      } catch (err) {
        if (myGen !== this.generation) return;
        this.setOrbState('error');
        this.setStatus('রূপান্তর ব্যর্থ হয়েছে, আবার চেষ্টা করুন।');
        setTimeout(() => { if (this.active) this.listen(); }, 1500);
        return;
      }
      if (myGen !== this.generation) return;

      if (!text) {
        this.setStatus('কিছু শোনা যায়নি, আবার বলুন।');
        this.listen();
        return;
      }

      voiceTranscript.textContent = text;
      addUserMessage(text);
      this.setOrbState('thinking');
      this.setStatus('ভাবছে…');

      let result;
      try {
        result = await ask(text);
      } catch (err) {
        result = { text: '', failed: true };
      }
      if (myGen !== this.generation) return;

      if (!result || result.failed || !result.text) {
        this.setOrbState('error');
        this.setStatus('উত্তর তৈরি করা যায়নি, আবার চেষ্টা করুন।');
        setTimeout(() => { if (this.active) this.listen(); }, 1500);
        return;
      }

      voiceTranscript.textContent = result.text.length > 220
        ? result.text.slice(0, 220) + '…'
        : result.text;
      this.setOrbState('thinking');
      this.setStatus('কণ্ঠস্বর তৈরি করা হচ্ছে…');

      let audioUrl;
      try {
        audioUrl = await synthesizeSpeech(result.text);
      } catch (err) {
        if (myGen !== this.generation) return;
        // TTS failed (e.g. the voice server is out of GPU memory) -- still
        // move on and keep the conversation going by text.
        this.setOrbState('error');
        this.setStatus('কণ্ঠস্বর তৈরি ব্যর্থ হয়েছে, লেখায় উত্তর দেখুন।');
        setTimeout(() => { if (this.active) this.listen(); }, 1500);
        return;
      }
      if (myGen !== this.generation) return;

      this.setOrbState('speaking');
      this.setStatus('বলছে… (থামাতে কথা বলুন)');
      this.speaking = true;
      this.speakingStartedAt = performance.now();
      const audio = this.playerEl;
      audio.src = audioUrl;

      const cleanupAudio = () => {
        audio.removeEventListener('ended', onEnded);
        audio.removeEventListener('error', onError);
        URL.revokeObjectURL(audioUrl);
        this.speaking = false;
        this.interruptPlayback = null;
      };
      const onEnded = () => {
        cleanupAudio();
        if (myGen !== this.generation) return;
        this.setOrbState(null);
        this.setStatus('শুনছি…');
        // Safety net: listen() should already be running (started below,
        // concurrently with playback), but restart it if it somehow died.
        if (!this.recorder || this.recorder.state !== 'recording') this.listen();
      };
      const onError = () => {
        cleanupAudio();
        if (myGen !== this.generation) return;
        this.setOrbState('error');
        this.setStatus('অডিও চালানো সম্ভব হয়নি।');
        if (!this.recorder || this.recorder.state !== 'recording') this.listen();
      };
      audio.addEventListener('ended', onEnded);
      audio.addEventListener('error', onError);
      // Exposed so listen()'s tick loop can cut the reply off the instant it
      // detects the user talking over it.
      this.interruptPlayback = () => {
        audio.pause();
        cleanupAudio();
      };

      /*
       * Start listening immediately, concurrently with playback, instead of
       * waiting for the reply to finish -- this is what makes barge-in
       * possible at all. Without it the mic is simply off while the bot
       * talks and there is nothing to interrupt with.
       */
      this.listen();

      try {
        await audio.play();
      } catch (err) {
        onError();
      }
    },
  };

  micBtn.addEventListener('click', () => VoiceMode.open());
  voiceCloseBtn.addEventListener('click', () => VoiceMode.close());
  voiceMuteBtn.addEventListener('click', () => VoiceMode.toggleMute());

  resetBtn.addEventListener('click', async () => {
    if (sessionId) {
      try {
        await fetch(API_BASE + '/api/v1/reset', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true',
          },
          body: JSON.stringify({ session_id: sessionId }),
        });
      } catch (e) {

      }
    }
    messagesEl.innerHTML = '';
    greet();
    inputEl.focus();
  });

  function greet() {
    addRow('bot').textContent =
      'আসসালামু আলাইকুম। এনআইডি বা ভোটার সেবা সম্পর্কে আপনার প্রশ্ন লিখুন।';
  }

  greet();
  </script>
</body>
</html>
