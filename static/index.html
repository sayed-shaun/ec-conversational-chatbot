<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f6b45" />
  <title>নির্বাচন কমিশন চ্যাটবট</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="avatar avatar-bot" aria-hidden="true">🗳️</div>
        <div class="header-text">
          <div class="header-title">নির্বাচন কমিশন সহায়ক</div>
          <div class="header-subtitle">AI চ্যাটবট</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="reset-btn" class="icon-btn" title="নতুন কথোপকথন শুরু করুন" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 .49-6.5L1 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <div class="settings-panel">
      <details class="params-details">
        <summary>প্যারামিটার</summary>
        <div class="params-grid">
          <label class="param">
            <span>top_k</span>
            <input id="param-top-k" type="number" min="1" max="50" step="1" value="10" />
          </label>
          <label class="param">
            <span>min_score</span>
            <input id="param-min-score" type="number" min="0" max="1" step="0.01" value="0.9" />
          </label>
          <label class="param">
            <span>min_score_ratio</span>
            <input id="param-min-score-ratio" type="number" min="0" step="0.1" value="1" />
          </label>
          <label class="param param-check">
            <input id="param-handle-unknown" type="checkbox" checked />
            <span>handle_unknown</span>
          </label>
          <label class="param param-check">
            <input id="param-show-candidates" type="checkbox" checked />
            <span>show_candidates</span>
          </label>
        </div>
      </details>
    </div>

    <main id="messages" class="messages" aria-live="polite"></main>

    <form id="chat-form" class="composer">
      <textarea
        id="question-input"
        class="composer-input"
        placeholder="আপনার প্রশ্ন লিখুন..."
        rows="1"
      ></textarea>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </form>
  </div>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
