<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f6b45" />
  <title>নির্বাচন কমিশন চ্যাটবট</title>
  <style>
  :root {
    --green: #0f6b45;
    --green-dark: #0a4f33;
    --green-soft: #eaf4ef;
    --green-line: #cfe4d9;
    --red: #f42a41;
    --amber: #b26a00;
    --bg: #f4f6f5;
    --panel: #ffffff;
    --text: #1c2521;
    --muted: #5f6f68;
    --line: #e2e7e4;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans Bengali", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .app {
    /*
     * dvh, not vh: on mobile browsers 100vh includes the area behind the
     * URL bar, so the app renders taller than the visible screen and the
     * composer at the bottom ends up off-screen -- unreachable, because
     * html/body have overflow: hidden. dvh tracks the actually-visible
     * height. The vh line stays first as a fallback for old browsers.
     */
    height: calc(100vh - 32px);
    height: calc(100dvh - 32px);
    height: calc(var(--app-h, 100dvh) - 32px);
    max-width: 860px;
    margin: 16px auto;
    background: var(--panel);
    display: flex;
    flex-direction: column;
    border-radius: 18px;

    overflow: hidden;
    box-shadow: 0 2px 6px rgba(15, 40, 30, 0.05),
                0 12px 32px rgba(15, 40, 30, 0.08);
  }

  .header {
    background: var(--green);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: none;
  }
  .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1.15rem;
    flex: none;
  }
  .avatar-bot { background: rgba(255,255,255,0.18); }
  .header-text { min-width: 0; }
  .header-title {
    font-size: 1rem; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .header-subtitle { font-size: 0.75rem; opacity: 0.85; }
  .header-actions { display: flex; gap: 8px; }
  .icon-btn {
    background: rgba(255,255,255,0.15);
    border: none; color: #fff;
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.28); }
  .icon-btn svg { width: 17px; height: 17px; }

  .messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row { display: flex; gap: 10px; max-width: 100%; }
  .row.user { flex-direction: row-reverse; }
  .row .avatar { width: 30px; height: 30px; font-size: 0.9rem; }
  .row.bot .avatar { background: var(--green-soft); }
  .row.user .avatar { background: var(--green); color: #fff; }

  .bubble {
    max-width: 78%;
    padding: 10px 13px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 0.93rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--green);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .row.bot .bubble {
    background: #fff;
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }

  .think {
    font-size: 0.78rem;
    background: #f2f5f4;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .think > summary {
    cursor: pointer;
    padding: 5px 9px;
    color: var(--muted);
    list-style: none;
    user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .think > summary::-webkit-details-marker { display: none; }
  .think > summary::before { content: "\25B8"; font-size: 0.65rem; }
  .think[open] > summary::before { content: "\25BE"; }
  .think-body {
    padding: 0 9px 8px;
    max-height: 160px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 0.71rem;
    line-height: 1.5;
    color: var(--muted);
    white-space: pre-wrap;
  }

  .tool {
    border: 1px solid var(--green-line);
    border-left: 3px solid var(--green);
    background: var(--green-soft);
    border-radius: 7px;
    padding: 7px 10px;
    margin-bottom: 8px;
    font-size: 0.78rem;
  }
  .tool-name {
    font-family: var(--mono);
    font-weight: 600;
    color: var(--green-dark);
    display: flex; align-items: center; gap: 5px;
  }
  .tool.running .tool-name::after {
    content: "";
    width: 9px; height: 9px;
    border: 2px solid var(--green);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool-args {
    display: block;
    font-family: var(--mono);
    font-size: 0.71rem;
    color: #47574f;
    margin-top: 3px;
    word-break: break-all;
  }
  .tool-res {
    display: block;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px dashed var(--green-line);
    font-size: 0.72rem;
    font-family: var(--mono);
  }
  .tool-res .ok { color: var(--green-dark); font-weight: 600; }
  .tool-res .weak { color: var(--amber); font-weight: 600; }
  .tool-res .bad { color: var(--red); font-weight: 600; }
  .cands { margin-top: 4px; color: var(--muted); font-size: 0.69rem; }
  .cands div { padding-left: 10px; }

  .stream-err { color: var(--red); font-size: 0.78rem; display: block; margin-top: 6px; }
  .timing {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 7px;
    font-variant-numeric: tabular-nums;
    cursor: help;
  }
  .cursor::after {
    content: "\258B";
    animation: blink 1s steps(2, start) infinite;
    opacity: 0.65;
  }
  @keyframes blink { to { visibility: hidden; } }

  .composer {
    flex: none;
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: #fff;
  }
  .composer-input {
    flex: 1;
    resize: none;
    max-height: 140px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 20px;
    font: inherit;
    font-size: 0.93rem;
    line-height: 1.5;
    outline: none;
  }
  .composer-input:focus { border-color: var(--green); }
  .send-btn {
    flex: none;
    width: 42px; height: 42px;
    border: none; border-radius: 50%;
    background: var(--green);
    color: #fff;
    cursor: pointer;
    display: grid; place-items: center;
  }
  .send-btn:hover:not(:disabled) { background: var(--green-dark); }
  .send-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .send-btn svg { width: 19px; height: 19px; }

  .mic-btn {
    flex: none;
    width: 42px; height: 42px;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: #fff;
    color: var(--green);
    cursor: pointer;
    display: grid; place-items: center;
  }
  .mic-btn:hover:not(:disabled) { background: var(--green-soft); }
  .mic-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .mic-btn svg { width: 19px; height: 19px; }
  .mic-btn .stop-icon { display: none; }
  .mic-btn.recording {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .mic-btn.recording .mic-icon { display: none; }
  .mic-btn.recording .stop-icon { display: block; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(244, 42, 65, 0.45); }
    50%      { box-shadow: 0 0 0 7px rgba(244, 42, 65, 0); }
  }
  .mic-status {
    font-size: 0.75rem;
    color: var(--muted);
    padding: 0 16px 6px;
    min-height: 1.1em;
  }
  .mic-status.error { color: var(--red); }

  @media (max-width: 600px) {
    .bubble { max-width: 85%; }
    .app {
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      height: var(--app-h, 100dvh);
      margin: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .icon-btn { width: 44px; height: 44px; }
    .icon-btn svg { width: 20px; height: 20px; }
    .send-btn { width: 44px; height: 44px; }
    .mic-btn { width: 44px; height: 44px; }
    .composer-input {
      font-size: 16px;
      padding: 12px 14px;
    }
    .composer {
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      gap: 8px;
    }
    .header { padding: 10px 14px; }
  }

  .answer p { margin: 0 0 0.6em; }
  .answer p:last-child { margin-bottom: 0; }
  .answer ul, .answer ol { margin: 0 0 0.6em; padding-left: 1.4em; }
  .answer li { margin-bottom: 0.2em; }
  .answer h3, .answer h4, .answer h5, .answer h6 {
    margin: 0.6em 0 0.3em;
    font-size: 1em;
    font-weight: 700;
  }
  .answer h3:first-child, .answer h4:first-child { margin-top: 0; }
  .answer strong { font-weight: 700; }
  .answer em { font-style: italic; }
  .answer code {
    font-family: var(--mono);
    font-size: 0.85em;
    background: var(--green-soft);
    border: 1px solid var(--green-line);
    border-radius: 4px;
    padding: 0.05em 0.35em;
  }
  .row.user .answer code { background: rgba(255,255,255,0.18); border-color: transparent; }
  .answer pre {
    background: #1e2723;
    color: #e6efe9;
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 0 0 0.6em;
  }
  .answer pre code { background: none; border: none; padding: 0; color: inherit; }
  .answer a { color: var(--green-dark); text-decoration: underline; }
  .row.user .answer a { color: #fff; }

  .retry-btn {
    margin-top: 6px;
    padding: 5px 12px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--text);
    font-size: 0.78rem;
    cursor: pointer;
  }
  .retry-btn:hover { background: var(--green-soft); border-color: var(--green-line); }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <div class="avatar avatar-bot" aria-hidden="true">🗳️</div>
        <div class="header-text">
          <div class="header-title">নির্বাচন কমিশন সহায়ক</div>
          <div class="header-subtitle">AI চ্যাটবট</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="reset-btn" class="icon-btn" title="নতুন কথোপকথন শুরু করুন" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 .49-6.5L1 10"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="mic-status" class="mic-status" aria-live="polite"></div>

    <form id="chat-form" class="composer">
      <textarea
        id="question-input"
        class="composer-input"
        placeholder="আপনার প্রশ্ন লিখুন..."
        rows="1"
      ></textarea>
      <button id="mic-btn" class="mic-btn" type="button" aria-label="ভয়েস ইনপুট" title="কথা বলে প্রশ্ন করুন">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="6" y="6" width="12" height="12" rx="2"></rect>
        </svg>
      </button>
      <button id="send-btn" class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </form>
  </div>

  <script>
  /*
   * Base URL of the chatbot API. Empty means same-origin, which is what
   * this default supports when the page is served by the FastAPI app
   * itself (StaticFiles at /static) -- leave it as '' for that case.
   *
   * When this file is deployed separately (e.g. to Vercel), vercel.json's
   * buildCommand patches this line at build time from the NGROK_URL
   * environment variable set in the Vercel project, so the public tunnel
   * URL never has to be hardcoded or committed. The backend must also
   * allow the Vercel origin via CORS_ALLOW_ORIGINS and be reachable over
   * HTTPS, since an HTTPS page cannot call a plain HTTP API.
   */
  const API_BASE = 'https://unraveled-cupbearer-outback.ngrok-free.dev';

  function escapeHtml(text) {
    return text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function renderInline(text) {
    let out = escapeHtml(text);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/__([^_]+)__/g, '<strong>$1</strong>');
    out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
    out = out.replace(/(^|[^_])_([^_\n]+)_(?!_)/g, '$1<em>$2</em>');
    out = out.replace(
      /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );
    return out;
  }

  function renderMarkdown(source) {
    const lines = source.replace(/\r\n/g, '\n').split('\n');
    const html = [];
    let paragraph = [];
    let list = null;
    let inCode = false;
    let codeLines = [];

    function flushParagraph() {
      if (paragraph.length) {
        html.push('<p>' + renderInline(paragraph.join(' ')) + '</p>');
        paragraph = [];
      }
    }

    function flushList() {
      if (list) {
        html.push('</' + list + '>');
        list = null;
      }
    }

    for (const rawLine of lines) {
      const line = rawLine.trimEnd();

      if (line.trim().startsWith('```')) {
        if (inCode) {
          html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
          codeLines = [];
          inCode = false;
        } else {
          flushParagraph();
          flushList();
          inCode = true;
        }
        continue;
      }
      if (inCode) {
        codeLines.push(rawLine);
        continue;
      }

      if (line.trim() === '') {
        flushParagraph();
        continue;
      }

      const heading = line.match(/^(#{1,4})\s+(.*)$/);
      if (heading) {
        flushParagraph();
        flushList();
        const level = heading[1].length + 2;
        html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
        continue;
      }

      const ordered = line.match(/^\s*[0-9০-৯]+[.)]\s+(.*)$/);
      const bulleted = line.match(/^\s*[-*•]\s+(.*)$/);
      if (ordered || bulleted) {
        flushParagraph();
        const tag = ordered ? 'ol' : 'ul';
        if (list !== tag) {
          flushList();
          html.push('<' + tag + '>');
          list = tag;
        }
        html.push('<li>' + renderInline((ordered || bulleted)[1]) + '</li>');
        continue;
      }

      flushList();
      paragraph.push(line);
    }

    flushParagraph();
    flushList();
    if (inCode && codeLines.length) {
      html.push('<pre><code>' + escapeHtml(codeLines.join('\n')) + '</code></pre>');
    }

    return html.join('');
  }

  const messagesEl = document.getElementById('messages');
  const formEl = document.getElementById('chat-form');
  const inputEl = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const resetBtn = document.getElementById('reset-btn');
  const micBtn = document.getElementById('mic-btn');
  const micStatus = document.getElementById('mic-status');

  let sessionId = localStorage.getItem('ec_faq_session_id') || null;
  let busy = false;

  function el(tag, cls, parent) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (parent) parent.appendChild(node);
    return node;
  }

  const BENGALI_DIGITS = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];

  function toBengaliDigits(str) {
    return String(str).replace(/[0-9]/g, (d) => BENGALI_DIGITS[+d]);
  }

  function formatSeconds(ms) {
    return toBengaliDigits((ms / 1000).toFixed(1));
  }

  const nearBottom = () =>
    messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 70;

  function stickToBottom(wasNear) {
    if (wasNear) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addRow(who) {
    const row = el('div', 'row ' + who, messagesEl);
    const avatar = el('div', 'avatar avatar-' + who, row);
    avatar.textContent = who === 'user' ? '\u{1F464}' : '\u{1F5F3}️';
    avatar.setAttribute('aria-hidden', 'true');
    const bubble = el('div', 'bubble', row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addUserMessage(text) {
    addRow('user').textContent = text;
  }

  function renderAnswer(answerEl, raw) {
    answerEl.innerHTML = renderMarkdown(raw);
  }

  function addRetryButton(bubble, text) {
    const btn = el('button', 'retry-btn', bubble);
    btn.type = 'button';
    btn.textContent = '↻ আবার চেষ্টা করুন';
    btn.addEventListener('click', () => {
      bubble.remove();
      ask(text);
    });
  }

  async function ask(text) {
    const bubble = addRow('bot');

    const think = el('details', 'think', bubble);
    const thinkSummary = el('summary', null, think);
    thinkSummary.textContent = 'চিন্তা করছে…';
    const thinkBody = el('div', 'think-body', think);
    const toolsEl = el('div', 'tools', bubble);
    const answerEl = el('div', 'answer cursor', bubble);

    think.style.display = 'none';
    think.open = true;

    let chip = null;
    let answerStarted = false;
    let toolRan = false;

    // Timing, so the wait after a tool call is visible rather than a mystery.
    const startedAt = performance.now();
    let toolResultAt = null;
    let firstTokenAt = null;
    let answerRaw = '';
    let failed = false;

    const handle = (ev) => {
      const wasNear = nearBottom();

      switch (ev.type) {
        case 'start':
          sessionId = ev.session_id;
          localStorage.setItem('ec_faq_session_id', sessionId);
          break;

        case 'reasoning':
          think.style.display = '';
          thinkBody.textContent += ev.text;
          thinkBody.scrollTop = thinkBody.scrollHeight;
          /*
           * After a tool result the model runs a second thinking pass before
           * the first answer token, which is the bulk of the wait on a
           * reasoning model. Without this the block stayed collapsed under a
           * static label and the UI looked frozen for that whole stretch.
           */
          if (!answerStarted) {
            thinkSummary.textContent = toolRan
              ? 'উত্তর তৈরি করছে…'
              : 'চিন্তা করছে…';
          }
          break;

        case 'tool_call': {
          toolRan = true;
          collapseThinking();
          chip = el('div', 'tool running', toolsEl);
          el('span', 'tool-name', chip).textContent = '\u{1F527} ' + ev.name;
          let args = ev.arguments || '';
          try {
            args = JSON.stringify(JSON.parse(args));
          } catch (e) {

          }
          el('code', 'tool-args', chip).textContent = args;
          break;
        }

        case 'tool_result': {
          toolResultAt = performance.now();
          if (!chip) break;
          chip.classList.remove('running');
          const res = el('span', 'tool-res', chip);

          if (ev.error) {
            const bad = el('span', 'bad', res);
            bad.textContent = '✗ ' + ev.error;
            break;
          }

          const score = ev.best_score == null ? '?' : Number(ev.best_score).toFixed(3);
          const verdict = el('span', ev.confident ? 'ok' : 'weak', res);
          verdict.textContent =
            (ev.confident ? '✓ confident' : '⚠ low confidence') +
            ' · ' + (ev.best_tag || '-') +
            ' · ' + score +
            (ev.threshold != null ? ' / ' + Number(ev.threshold).toFixed(2) : '');

          if (ev.candidates && ev.candidates.length) {
            const cands = el('div', 'cands', res);
            el('div', null, cands).textContent =
              ev.alternatives + ' other candidate(s):';
            ev.candidates.forEach((c) => {
              const line = el('div', null, cands);
              const s = c.score == null ? '?' : Number(c.score).toFixed(3);
              line.textContent = '· ' + c.tag + '  ' + s;
            });
          }
          break;
        }

        case 'token':
          if (!answerStarted) {
            answerStarted = true;
            firstTokenAt = performance.now();
            collapseThinking();
          }
          answerRaw += ev.text;
          renderAnswer(answerEl, answerRaw);
          break;

        case 'error':
          failed = true;
          el('span', 'stream-err', bubble).textContent =
            '⚠ ' + (ev.message || 'stream error');
          break;

        case 'done': {
          if (!answerRaw.trim()) {
            answerRaw = ev.reply || '(কোনো উত্তর পাওয়া যায়নি)';
            renderAnswer(answerEl, answerRaw);
          }

          const total = performance.now() - startedAt;
          const timing = el('div', 'timing', bubble);
          timing.textContent = '\u23F1 ' + formatSeconds(total) + ' সেকেন্ড';

          // Breakdown on hover: most of a slow turn is the model thinking
          // after the tool result, which is otherwise invisible.
          const parts = [];
          if (toolResultAt !== null) {
            parts.push('তথ্য খোঁজা: ' + formatSeconds(toolResultAt - startedAt) + ' সে.');
          }
          if (firstTokenAt !== null) {
            parts.push('উত্তর শুরু: ' + formatSeconds(firstTokenAt - startedAt) + ' সে.');
            parts.push('উত্তর লেখা: ' + formatSeconds(performance.now() - firstTokenAt) + ' সে.');
          }
          if (parts.length) timing.title = parts.join(' · ');
          break;
        }
      }

      stickToBottom(wasNear);
    };

    function collapseThinking() {
      if (think.style.display === 'none') return;
      think.open = false;
      thinkSummary.textContent = 'চিন্তার ধাপ দেখুন';
    }

    try {
      const res = await fetch(API_BASE + '/api/v1/chat/stream', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          /*
           * ngrok's free tier serves a browser interstitial warning page
           * (ERR_NGROK_6024) to any request carrying a browser User-Agent,
           * so every API call from a real browser would get HTML back
           * instead of JSON. This header opts out. Harmless when API_BASE
           * is not an ngrok tunnel.
           */
          'ngrok-skip-browser-warning': 'true',
        },
        body: JSON.stringify({
          session_id: sessionId,
          message: text,
        }),
      });
      if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const frames = buffer.split('\n\n');
        buffer = frames.pop();

        for (const frame of frames) {
          for (const line of frame.split('\n')) {
            if (!line.startsWith('data: ')) continue;
            const raw = line.slice(6);
            if (raw === '[DONE]') continue;
            try {
              handle(JSON.parse(raw));
            } catch (e) {

            }
          }
        }
      }
    } catch (err) {
      failed = true;
      el('span', 'stream-err', bubble).textContent =
        'দুঃখিত, সার্ভারের সাথে সংযোগ করা যায়নি।';
    } finally {
      answerEl.classList.remove('cursor');
      if (!thinkBody.textContent.trim()) think.style.display = 'none';
      if (failed) addRetryButton(bubble, text);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
  }

  async function submit() {
    const text = inputEl.value.trim();
    if (!text || busy) return;

    busy = true;
    sendBtn.disabled = true;
    addUserMessage(text);
    inputEl.value = '';
    inputEl.style.height = 'auto';

    try {
      await ask(text);
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    submit();
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      submit();
    }
  });

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  /* ------------------------------------------------- visible-height sync */

  /*
   * dvh handles the URL bar, but iOS Safari's on-screen keyboard overlays the
   * page instead of shrinking dvh, which would leave the composer hidden
   * behind the keyboard. visualViewport is the only thing that reports the
   * genuinely visible height in both cases.
   */
  function syncAppHeight() {
    const vv = window.visualViewport;
    if (!vv) return;
    document.documentElement.style.setProperty('--app-h', vv.height + 'px');
  }

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncAppHeight);
    window.visualViewport.addEventListener('scroll', syncAppHeight);
    syncAppHeight();
  }

  // Keep the latest message in view when the keyboard opens over the page.
  inputEl.addEventListener('focus', () => {
    setTimeout(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }, 250);
  });

  /* ---------------------------------------------------------- voice input */

  let recorder = null;
  let recordedChunks = [];
  let recordingStream = null;

  function setMicStatus(text, isError) {
    micStatus.textContent = text || '';
    micStatus.classList.toggle('error', !!isError);
  }

  function stopRecordingStream() {
    if (recordingStream) {
      recordingStream.getTracks().forEach((t) => t.stop());
      recordingStream = null;
    }
  }

  async function transcribe(blob) {
    /*
     * Caddy proxies /asr* straight to the ASR service, so this only ever
     * talks to the same origin as the chat API -- no second URL to configure,
     * and no mixed-content problem when the page is served over HTTPS.
     */
    const form = new FormData();
    const ext = (blob.type || '').includes('mp4') ? 'mp4' : 'webm';
    form.append('file', blob, 'recording.' + ext);
    form.append('model_type', 'wav2vec2');

    const res = await fetch(API_BASE + '/asr/upload', {
      method: 'POST',
      headers: { 'ngrok-skip-browser-warning': 'true' },
      body: form,
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const data = await res.json();
    return ((data.output && data.output[0] && data.output[0].source) || '').trim();
  }

  async function startRecording() {
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setMicStatus('এই ব্রাউজারে ভয়েস রেকর্ডিং সমর্থিত নয়।', true);
      return;
    }
    try {
      recordingStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      // Permission denied, or no microphone available.
      setMicStatus('মাইক্রোফোন ব্যবহারের অনুমতি পাওয়া যায়নি।', true);
      return;
    }

    recordedChunks = [];
    // Let the browser pick its own container; Safari records mp4, Chrome webm.
    // The ASR service accepts both, so no conversion is needed.
    try {
      recorder = new MediaRecorder(recordingStream);
    } catch (err) {
      stopRecordingStream();
      setMicStatus('রেকর্ডিং শুরু করা যায়নি।', true);
      return;
    }

    recorder.addEventListener('dataavailable', (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    });

    // Captured now: stopRecording() clears `recorder` synchronously, so the
    // async 'stop' handler below cannot read anything off it.
    const recordedMimeType = recorder.mimeType;

    recorder.addEventListener('stop', async () => {
      stopRecordingStream();
      micBtn.classList.remove('recording');
      const blob = new Blob(recordedChunks, { type: recordedMimeType });

      if (!blob.size) {
        setMicStatus('কোনো অডিও রেকর্ড হয়নি।', true);
        return;
      }

      micBtn.disabled = true;
      setMicStatus('কথা লেখায় রূপান্তর করা হচ্ছে…');
      try {
        const text = await transcribe(blob);
        if (!text) {
          setMicStatus('কিছু শোনা যায়নি, আবার চেষ্টা করুন।', true);
          return;
        }
        // Put the transcript in the box rather than sending it blind, so a
        // misheard word can be corrected before asking.
        inputEl.value = text;
        inputEl.dispatchEvent(new Event('input', { bubbles: true }));
        inputEl.focus();
        setMicStatus('');
      } catch (err) {
        setMicStatus('রূপান্তর ব্যর্থ হয়েছে, আবার চেষ্টা করুন।', true);
      } finally {
        micBtn.disabled = false;
      }
    });

    recorder.start();
    micBtn.classList.add('recording');
    micBtn.setAttribute('aria-label', 'রেকর্ডিং বন্ধ করুন');
    setMicStatus('শুনছি… বলা শেষ হলে আবার চাপুন।');
  }

  function stopRecording() {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    recorder = null;
    micBtn.setAttribute('aria-label', 'ভয়েস ইনপুট');
  }

  micBtn.addEventListener('click', () => {
    if (micBtn.classList.contains('recording')) {
      stopRecording();
    } else {
      startRecording();
    }
  });

  resetBtn.addEventListener('click', async () => {
    if (sessionId) {
      try {
        await fetch(API_BASE + '/api/v1/reset', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'ngrok-skip-browser-warning': 'true',
          },
          body: JSON.stringify({ session_id: sessionId }),
        });
      } catch (e) {

      }
    }
    messagesEl.innerHTML = '';
    greet();
    inputEl.focus();
  });

  function greet() {
    addRow('bot').textContent =
      'আসসালামু আলাইকুম। এনআইডি বা ভোটার সেবা সম্পর্কে আপনার প্রশ্ন লিখুন।';
  }

  greet();
  </script>
</body>
</html>
